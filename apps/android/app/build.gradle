plugins { id 'com.android.application' }
android {
    namespace 'cn.liubai.app'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.liubai.app'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.1.0-alpha2'
        testInstrumentationRunner 'cn.liubai.app.SmokeInstrumentation'
    }
    signingConfigs {
        release {
            if (System.getenv('LIUBAI_KEYSTORE')) {
                storeFile file(System.getenv('LIUBAI_KEYSTORE'))
                storePassword System.getenv('LIUBAI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LIUBAI_KEY_ALIAS')
                keyPassword System.getenv('LIUBAI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview2'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', '留白修复内测'
        }
        release {
            if (System.getenv('LIUBAI_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
            resValue 'string', 'app_name', '留白'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
